{{ if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels:
      app: postgres
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      {{ if .Values.kubeIpDnsUpdaterSecret }}
      serviceAccountName: {{ .Values.kubeIpDnsUpdaterServiceAccountName | quote }}
      initContainers:
      - name: dns
        image: orihoch/kube-ip-dns-updater:v0.0.9
        envFrom:
        - secretRef:
            name: {{ .Values.kubeIpDnsUpdaterSecret | quote }}
        env:
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      {{ end }}
      tolerations:
        - key: "HighPriorityWorkloads"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
      - name: postgres
        image: {{ .Values.image | default "budgetkey/budgetkey-postgres:latest" | quote }}
        ports:
        - containerPort: 5432
          {{ if .Values.enableHostPort }}hostPort: 5432{{ end }}
        resources: {{ .Values.resources }}
        env:
        - name: POSTGRES_PASSWORD
        {{ if .Values.secretName }}
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secretName | quote }}
              key: POSTGRES_PASSWORD
        {{ else }}
          value: "123456"
        {{ end }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data/db
          # postgres doesn't let you use the root of a disk (it complaints about having lost+found directory)
          subPath: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres
{{ end }}
